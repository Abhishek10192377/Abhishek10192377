<svg width="1000" height="140" viewBox="0 0 1000 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#1a0005"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="impact" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DC143C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DC143C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="140" fill="url(#bg2)"/>

  <!-- faint static web backdrop -->
  <g stroke="#DC143C" stroke-width="0.6" opacity="0.15">
    <line x1="0" y1="0" x2="1000" y2="140"/>
    <line x1="0" y1="140" x2="1000" y2="0"/>
    <line x1="500" y1="0" x2="500" y2="140"/>
    <line x1="0" y1="70" x2="1000" y2="70"/>
  </g>

  <!-- Spider (left) - subtle crawl bob -->
  <g transform="translate(70,70)">
    <animateTransform attributeName="transform" type="translate"
      values="70,70; 70,64; 70,70" dur="1.4s" repeatCount="indefinite" additive="sum"/>
    <ellipse cx="0" cy="0" rx="10" ry="14" fill="none" stroke="#DC143C" stroke-width="1.6"/>
    <circle cx="0" cy="-16" r="6" fill="none" stroke="#DC143C" stroke-width="1.6"/>
    <line x1="-10" y1="-3" x2="-24" y2="-12" stroke="#DC143C" stroke-width="1.3"/>
    <line x1="-10" y1="4" x2="-26" y2="4" stroke="#DC143C" stroke-width="1.3"/>
    <line x1="-10" y1="11" x2="-24" y2="20" stroke="#DC143C" stroke-width="1.3"/>
    <line x1="10" y1="-3" x2="24" y2="-12" stroke="#DC143C" stroke-width="1.3"/>
    <line x1="10" y1="4" x2="26" y2="4" stroke="#DC143C" stroke-width="1.3"/>
    <line x1="10" y1="11" x2="24" y2="20" stroke="#DC143C" stroke-width="1.3"/>
  </g>

  <!-- Web shot thread traveling left to right, looping -->
  <line x1="95" y1="70" x2="95" y2="70" stroke="#DC143C" stroke-width="2" stroke-linecap="round">
    <animate attributeName="x2" values="95;95;930;930;95" keyTimes="0;0.15;0.55;0.75;1" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.15;0.55;0.6;1" dur="2.4s" repeatCount="indefinite"/>
  </line>

  <!-- small web strands trailing the shot -->
  <line x1="95" y1="70" x2="95" y2="70" stroke="#DC143C" stroke-width="1" opacity="0.5">
    <animate attributeName="x2" values="95;95;930;930;95" keyTimes="0;0.17;0.57;0.75;1" dur="2.4s" begin="0.05s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="70;70;55;55;70" keyTimes="0;0.17;0.57;0.75;1" dur="2.4s" begin="0.05s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0.5;0;0" keyTimes="0;0.17;0.57;0.6;1" dur="2.4s" repeatCount="indefinite"/>
  </line>
  <line x1="95" y1="70" x2="95" y2="70" stroke="#DC143C" stroke-width="1" opacity="0.5">
    <animate attributeName="x2" values="95;95;930;930;95" keyTimes="0;0.17;0.57;0.75;1" dur="2.4s" begin="0.05s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="70;70;85;85;70" keyTimes="0;0.17;0.57;0.75;1" dur="2.4s" begin="0.05s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0.5;0;0" keyTimes="0;0.17;0.57;0.6;1" dur="2.4s" repeatCount="indefinite"/>
  </line>

  <!-- Impact burst at the target -->
  <circle cx="930" cy="70" r="0" fill="url(#impact)">
    <animate attributeName="r" values="0;0;30;0;0" keyTimes="0;0.5;0.6;0.68;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#DC143C" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.5;0.58;0.68;1" dur="2.4s" repeatCount="indefinite"/>
    <line x1="930" y1="45" x2="930" y2="95"/>
    <line x1="905" y1="70" x2="955" y2="70"/>
    <line x1="912" y1="52" x2="948" y2="88"/>
    <line x1="912" y1="88" x2="948" y2="52"/>
  </g>

  <!-- Target crosshair mark (subtle, always visible) -->
  <g stroke="#DC143C" stroke-width="1" opacity="0.35">
    <circle cx="930" cy="70" r="16" fill="none"/>
    <circle cx="930" cy="70" r="3" fill="#DC143C"/>
  </g>

  <text x="500" y="128" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="13" letter-spacing="3" fill="#DC143C" opacity="0.7">WEB-SHOOTER ARMED // TARGET ACQUIRED</text>
</svg>
